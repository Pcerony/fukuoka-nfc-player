<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f2">
  <title>ふくおかの足音</title>
  <link rel="stylesheet" href="./style.css?v=20261123-12">
  <script type="module" src="./main.mjs?v=20261123-12"></script>
</head>
<body>
  <main class="player" aria-label="NFCプレーヤー" data-state="off">
    <h1>ふくおかの足音</h1>
    <div class="deck" aria-hidden="true">
      <svg class="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="roof">
            <stop offset=".65" stop-color="#fafafa"/>
            <stop offset=".89" stop-color="#e8e8e6"/>
            <stop offset=".96" stop-color="#fcfcfb"/>
            <stop offset="1" stop-color="#b8b8b5"/>
          </radialGradient>
          <radialGradient id="vinyl">
            <stop stop-color="#242427"/><stop offset=".79" stop-color="#111113"/>
            <stop offset=".96" stop-color="#252527"/><stop offset="1" stop-color="#080809"/>
          </radialGradient>
          <clipPath id="record-face"><circle cx="500" cy="500" r="80"/></clipPath>
          <linearGradient id="needle">
            <stop stop-color="#424448"/><stop offset=".14" stop-color="#93979b"/>
            <stop offset=".31" stop-color="#f7f8fa"/><stop offset=".45" stop-color="#d1d4d7"/>
            <stop offset=".73" stop-color="#92969b"/><stop offset=".86" stop-color="#c1c3c6"/>
            <stop offset="1" stop-color="#505359"/>
          </linearGradient>
          <linearGradient id="cartridge" x2=".7" y2="1">
            <stop stop-color="#545559"/><stop offset=".53" stop-color="#28292c"/>
            <stop offset=".54" stop-color="#1a1b1d"/><stop offset="1" stop-color="#101113"/>
          </linearGradient>
          <filter id="shadow" x="-35%" y="-35%" width="180%" height="180%">
            <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#333" flood-opacity=".32"/>
          </filter>
        </defs>
        <g class="scene">
        <image href="./dome-map.svg?v=20261123-12" width="1000" height="1000"/>
        <circle cx="500" cy="500" r="89" fill="url(#roof)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
        <g class="record" fill="none" stroke="#bfbfbd" stroke-width="1">
          <circle cx="500" cy="500" r="81" fill="url(#vinyl)" stroke="#121214" stroke-width="2"/>
          <image href="./record-artwork.png?v=20261123-12" x="420" y="420" width="160" height="160" clip-path="url(#record-face)"/>
        </g>
        <g transform="translate(-65 0)"><g class="arm" filter="url(#shadow)">
          <circle cx="665" cy="317" r="23" fill="url(#needle)" stroke="#aaa" stroke-width=".7"/>
          <circle cx="665" cy="316" r="20" fill="url(#cartridge)" stroke="#acadb0" stroke-width="1"/>
          <rect x="657" y="316" width="16" height="31" rx="7" fill="url(#needle)" stroke="#55575b" stroke-width=".7"/>
          <rect x="660" y="337" width="10" height="190" rx="5" fill="url(#needle)" stroke="#55575b" stroke-width=".7"/>
          <rect x="658" y="514" width="14" height="12" rx="3" fill="url(#needle)" stroke="#b5b5b2" stroke-width=".7"/>
          <path d="M657 522h16l3 7-2 16h-18l-2-16z" fill="url(#cartridge)" stroke="#111113" stroke-width=".75"/>
          <path d="M658 526h14m-11 16h8" stroke="#88898b" stroke-width="1"/>
          <path d="M663 545h4l-2 5z" fill="url(#needle)"/>
        </g></g>
        </g>
      </svg>
    </div>
    <a class="attribution" href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>
    <div class="controls">
      <button class="enable" type="button">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M5 9a4 4 0 0 1 0 6m4-9a8 8 0 0 1 0 12m4-15a12 12 0 0 1 0 18"/>
        </svg>
        NFCを有効にする
      </button>
      <p role="status"><span lang="ja">レコードを回してください</span><br><span lang="en">Please spin the record</span></p>
      <div class="track" hidden>
        <span class="theme"></span>
        <span class="date"></span>
        <span class="duration"></span>
        <button class="pause" type="button" aria-label="一時停止" title="一時停止">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path class="pause-icon" d="M7 5h3v14H7zm7 0h3v14h-3z"/>
            <path class="resume-icon" d="M8 5v14l11-7z"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="fullscreen" type="button" aria-label="全画面" title="全画面" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="expand" d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/>
        <path class="collapse" d="M8 3v3a2 2 0 0 1-2 2H3m13-5v3a2 2 0 0 0 2 2h3M3 16h3a2 2 0 0 1 2 2v3m13-5h-3a2 2 0 0 0-2 2v3"/>
      </svg>
    </button>
    <button class="reconnect" type="button" aria-label="NFCを再接続" title="NFCを再接続" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2 6m2-12v6h-6"/>
      </svg>
    </button>
    <dialog class="idle-dialog" aria-labelledby="wake-ja">
      <button class="activate" type="button" autofocus>
        <span id="wake-ja" lang="ja">画面をタップして再開</span>
        <span lang="en">Tap the screen to activate</span>
      </button>
      <span class="wake-error" role="status"></span>
    </dialog>
  </main>
</body>
</html>
